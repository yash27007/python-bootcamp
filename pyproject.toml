[project]
name = "ml-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "gensim>=4.3.3",
    "imbalanced-learn>=0.14.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "mlflow>=3.15.1",
    "nltk>=3.9.2",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "streamlit>=1.57.0",
    "tensorflow>=2.21.0",
    "wordcloud>=1.9.4",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
override-dependencies = ["pandas>=3.0.2"]
