[project]
name = "ml-course"
version = "0.1.0"
description = "Complete Machine Learning, NLP Bootcamp – MLOps & Deployment course materials"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Notebook runtime
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    # Data Science core
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    # Visualisation
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    # Machine Learning
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    # Web scraping (multi-threading examples)
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    # Web frameworks
    "flask>=3.0.0",
    "streamlit>=1.35.0",
]

[tool.uv]
dev-dependencies = []
